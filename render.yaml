services:
  - type: web
    name: tamil-auto
    env: node
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: HF_API_KEY
        sync: false
      - key: IG_ACCESS_TOKEN
        sync: false
      - key: IG_BUSINESS_ACCOUNT_ID
        sync: false
      - key: IMGBB_API_KEY
        value: ""
